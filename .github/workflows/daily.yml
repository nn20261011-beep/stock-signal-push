name: 每日选股信号推送

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00（工作日），09:20 前送达，开盘前可见
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      dry:
        description: '只生成不发信'
        required: false
        default: 'false'
      force:
        description: '强制发送（忽略当天已发）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -q numpy==2.1.3 pandas==2.2.3

      - name: 读历史缓存 + 抓当日增量（约 5 秒）
        run: python live_fetch.py

      - name: 多策略扫描 + 发送邮件
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then
            python push_lib.py --dry
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            python push_lib.py --force
          else
            python push_lib.py
          fi

      - name: 归档信号与实盘校验日志
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f _push_logs _hist.pkl.gz 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无新增日志"
          else
            git commit -m "signal logs $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin main || true
          fi
