name: 每日选股信号推送

on:
  schedule:
    # GitHub 免费版 schedule 实测延迟 56~60 分钟，故设 3 个错峰触发点。
    # 北京 18:00 / 20:00 / 22:00 = UTC 10:00 / 12:00 / 14:00
    # 脚本内部按 base_day 去重，一天最多发一封。
    - cron: '0 10 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      dry:
        description: '只生成不发信'
        required: false
        default: 'false'
      force:
        description: '跳过时间闸门（仅调试）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-signal-v3
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -q numpy==2.1.3 pandas==2.2.3

      - name: 抓当日行情增量
        run: python live_fetch.py

      - name: 生成并发送选股信号（战法池 v3）
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python push_v3.py $ARGS

      - name: 归档日志与历史缓存
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f _push_logs _hist.pkl.gz 2>/dev/null || true
          if git diff --cached --quiet; then echo "无新增"; else
            git commit -m "v3 logs $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin main || true
          fi
