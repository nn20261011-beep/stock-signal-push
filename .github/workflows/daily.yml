name: 每日选股信号推送

on:
  schedule:
    # 晚间主清单（次日开盘买）：3 个错峰点，抵抗 GitHub 排队延迟 56~60 分钟
    # 北京 18:00 / 20:00 / 22:00 = UTC 10:00 / 12:00 / 14:00
    - cron: '0 10 * * 1-5'
    - cron: '0 12 * * 1-5'
    - cron: '0 14 * * 1-5'
    # 早间竞价确认：3 个错峰点，各自自旋等到 9:25:40
    # 北京 07:00 / 08:00 / 09:00 = UTC 23:00(前一日) / 00:00 / 01:00
    # 用 GitHub 文件锁保证只有一个 run 真正发信；超过 9:28 自动放弃
    - cron: '0 23 * * 0-4'
    - cron: '0 0 * * 1-5'
    - cron: '0 1 * * 1-5'
    # 盘中封板预警：北京 9:00 启动一个 job，自旋跑到 14:50（320 分钟）
    # Linux cron 是 UTC，北京 9:00 = UTC 1:00
    - cron: '0 1 * * 1-5'
  workflow_dispatch:
    inputs:
      job:
        description: 'evening=晚间清单 / auction=竞价确认 / seal=盘中封板预警'
        required: false
        default: 'evening'
      dry:
        description: '只生成不发信'
        required: false
        default: 'false'
      force:
        description: '跳过时间闸门（仅调试）'
        required: false
        default: 'false'

permissions:
  contents: write

# 不加 workflow 级 concurrency：早间 3 个自旋 run 若被排队会错过 9:25 窗口。
# 去重改由脚本内部完成（晚间 send.log，早间 GitHub 文件锁）。

jobs:
  evening:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'evening' ||
      github.event_name == 'schedule' && contains(fromJSON('["0 10 * * 1-5", "0 12 * * 1-5", "0 14 * * 1-5"]'), github.event.schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -q numpy==2.1.3 pandas==2.2.3
      - name: 抓当日行情增量
        run: python live_fetch.py
      - name: 成交回填（历史推送盈亏写回纪律状态）
        run: python fill_trades.py --sell-mode=hold
      - name: 复盘昨日推送（真实涨跌核对）
        run: python daily_review.py
      - name: 对话红线机检（未通过则不推送）
        run: python redline_check.py --cloud
      - name: 七层决策（system_v4）
        env:
          DRY_RUN: ${{ inputs.dry }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry"; fi
          python system_v4.py $ARGS
      - name: 发送 v4 决策邮件
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry"; fi
          python notify_v4.py $ARGS
      - name: 生成并发送选股信号（战法池 v3 · 仅 v4 失败时兜底）
        if: failure()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python push_v3.py $ARGS
      - name: 归档
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f _push_logs _hist.pkl.gz 2>/dev/null || true
          if git diff --cached --quiet; then echo "无新增"; else
            git commit -m "v3 evening logs $(date -u +%F)"
            git pull --rebase origin main || true
            git push origin main || true
          fi

  auction:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'auction' ||
      github.event_name == 'schedule' && contains(fromJSON('["0 23 * * 0-4", "0 0 * * 1-5", "0 1 * * 1-5"]'), github.event.schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 竞价时段模式简报（个股推送已停）
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Shanghai
        run: |
          # 2026-11-24 停推个股：等「模式→战法」体系建成
          # 原逻辑每天读冻死的 _push_logs/latest_v3.json（base_day 2026-11-16），重复推同一批 4 只
          # 恢复：删掉下面两行，恢复 python auction_confirm_v3.py $ARGS
          echo "个股竞价推送已停用（等模式体系建成）"
          python mode_brief.py || true

  seal:
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'seal' ||
      github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1-5'
    runs-on: ubuntu-latest
    # 交易时段 320 分钟 < GitHub 单 job 上限 360 分钟
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -q numpy==2.1.3 pandas==2.2.3
      - name: 盘中封板预警
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TZ: Asia/Shanghai
        run: |
          ARGS=""
          if [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          # 一个 job 跑到 14:50；INTRADAY_ROUNDS=0 表示不限轮数
          INTRADAY_ROUNDS=0 INTRADAY_GAP=0 python intraday_loop.py $ARGS
      - name: 归档盘中去重状态（seal_sent 跨 job 持久）
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f _push_logs/seal_sent_*.json _push_logs/seal_count_*.txt _push_logs/send.log 2>/dev/null || true
          if git diff --cached --quiet; then echo "无新增"; else
            git commit -m "seal logs $(date -u +%F-%H%M)" || true
            git pull --rebase origin main || true
            git push origin main || true
          fi
